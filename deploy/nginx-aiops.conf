# ===========================================================================
#  AIOps 运维平台 - Nginx 配置 (2026-09 修复版)
#
#  本版本针对"闲置一段时间后第一次访问 502/超时"做了关键修正:
#
#  1) upstream keepalive_timeout 必须 < 后端的 --timeout-keep-alive
#     旧配置: nginx 60s / 后端 30s  -> 后端先关连接, nginx 仍复用这条死连接,
#             闲置后第一次请求必然超时 (nginx 要等一个连接周期才会剔除)。
#     新配置: nginx 55s / 后端 75s -> nginx 总是先关闭空闲连接, 不会复用死连接。
#
#  2) 增加 proxy_next_upstream_timeout, 把重试限制在总时长内, 避免叠加变慢。
#
#  3) /api/health 单独放行且不缓存, 供前端探活与 watchdog 使用。
#
#  4) AI 对话 / 轮询等长耗时接口单独放宽超时, 其余接口保持较短超时快速失败。
# ===========================================================================

upstream aiops_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;

    # 到后端的连接池: 复用 TCP 连接, 减少握手开销
    keepalive 32;
    # 空闲连接保持 55s, 必须小于后端 uvicorn 的 --timeout-keep-alive 75s
    keepalive_timeout 55s;
    keepalive_requests 1000;
}

server {
    listen 80;
    server_name _;                          # 改成你的域名或IP，_ 表示匹配所有

    # 前端静态文件（绝对路径，按实际解压位置修改）
    root /opt/aiops-deploy/frontend-dist;
    index index.html;

    # 允许上传较大的文件（如Excel导入、Agent包下载）
    client_max_body_size 50m;

    # 后端整体无响应时快速失败, 让前端自动重试而不是干等
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 120s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";                 # 启用 upstream 长连接
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 网络/网关类错误自动换一台重试, 并把重试限制在 15 秒内
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 15s;

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查: 不缓存、不写访问日志, 给前端探活和 watchdog 用
    location = /api/health {
        proxy_pass http://aiops_backend;
        access_log off;
        proxy_read_timeout 15s;
    }

    # 长耗时接口单独放宽
    location ~ ^/api/(chat|alerts/.+/analyze|vmware/hosts/.+/sync|network/.+/poll|storage/.+/poll|agents/package) {
        proxy_pass http://aiops_backend;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 其余 API 反向代理
    location /api/ {
        proxy_pass http://aiops_backend;
    }

    # 静态资源缓存 (文件名带 hash, 可长期缓存)
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # index.html 不缓存, 保证前端发版后能立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
