# AIOps 监控 Agent 配置文件
server:
  # 服务端上报接口地址
  url: "http://SERVER:8080/api/servers/report"
  # Agent 身份令牌, 需与服务端 agent_token 保持一致(请求头 X-Agent-Token)
  token: "aiops-agent-shared-token"

agent:
  # 采集/上报间隔(秒), 默认 5 秒
  interval: 5
  # HTTP 请求超时(秒)
  timeout: 10

# ---------------------------------------------------------------------------
# 网络共享盘(SMB)监控: 华为存储等以共享盘方式挂到本机 Windows 时, psutil 默认
# 不采集网络盘, 这里单独采集空间使用率。把你要监控的共享写进下面的列表即可。
#
# 写法(每行一个, 取消注释并改成你的实际地址):
#   - \\192.168.1.5\share            # 纯 UNC 路径(推荐, 服务身份下也能查)
#   - \\192.168.1.6\share | 华为存储A  # 路径后加 " | 备注名" 便于辨认
#   - Z:                             # 也可写已映射的盘符
#
# 说明: 写成 UNC(\\IP\共享名) 比写盘符更稳 —— Agent 若以 Windows 服务身份运行,
# 可能看不到交互用户映射的盘符, 但按 UNC 直接查空间不受影响。
# 留空(如下)则不采集。
# ---------------------------------------------------------------------------
nas_shares:
