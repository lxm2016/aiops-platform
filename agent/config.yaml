# AIOps 监控 Agent 配置文件
server:
  # 服务端上报接口地址
  url: "http://SERVER:8080/api/servers/report"
  # Agent 身份令牌, 需与服务端 agent_token 保持一致(请求头 X-Agent-Token)
  token: "aiops-agent-shared-token"

agent:
  # 采集/上报间隔(秒), 默认 5 秒
  interval: 5
  # HTTP 请求超时(秒)
  timeout: 10

# ---------------------------------------------------------------------------
# 网络共享盘(SMB)监控: 华为存储等以共享盘方式挂到本机 Windows 时, psutil 默认
# 不采集网络盘, 这里单独采集空间使用率。把你要监控的共享写进下面的列表即可。
#
# 写法(每行一个, 取消注释并改成你的实际地址):
#   - \\192.168.1.5\share            # 纯 UNC 路径(推荐, 服务身份下也能查)
#   - \\192.168.1.6\share | 华为存储A  # 路径后加 " | 备注名" 便于辨认
#   - Z:                             # 也可写已映射的盘符
#
# 说明: 写成 UNC(\\IP\共享名) 比写盘符更稳 —— Agent 若以 Windows 服务身份运行,
# 可能看不到交互用户映射的盘符, 但按 UNC 直接查空间不受影响。
# 留空(如下)则不采集。
# ---------------------------------------------------------------------------
nas_shares:

# ---------------------------------------------------------------------------
# 共享盘访问凭据(可选): 仅当 Agent 以"本地系统账户(SYSTEM)"运行、直接查 UNC
# 共享报"无法访问/无权限"时才需要。正常情况下(用有访问权限的账户运行 Agent)
# 留空即可。
#
# 为什么需要: SYSTEM 账户默认没有访问网络共享的凭据, 直接查 \\IP\共享 会失败。
# 这里按"共享所属主机 IP"配上 user / password, Agent 会用 WNetAddConnection2W
# 先带凭据建立连接再查空间。host 必须与上方 nas_shares 里 UNC 的 \\host 一致。
#
# 写法(取消注释并改成你的实际信息):
#   nas_creds:
#     192.168.1.5:
#       user: "storage\admin"      # 注意: 反斜杠写单个即可, 不要写成 \\
#       password: "你的密码"
#     192.168.1.6:
#       user: "admin"
#       password: "你的密码"
# ---------------------------------------------------------------------------
nas_creds:
